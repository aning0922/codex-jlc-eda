<svg xmlns="http://www.w3.org/2000/svg" width="820" height="256" viewBox="0 0 820 256" role="img" aria-labelledby="title desc">
  <title id="title">RC filter and C1 replacement</title>
  <desc id="desc">J1 pin 1 and TP1 connect to R1. Its output connects to J2 pin 1, TP2, C1 and R2. Both connector returns, C1, R2 and TP3 share ground. C1 changes from 10 to 100 nanofarads.</desc>
  <rect x="1" y="1" width="818" height="254" rx="10" fill="#f4f3e9" stroke="#c8cfc4" stroke-width="2"/>
  <g font-family="'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace">
    <text x="25" y="34" fill="#36584f" font-size="17" letter-spacing="1.3">RC FILTER</text>
    <text x="795" y="34" fill="#864921" font-size="17" text-anchor="end">C1 · 10 nF → 100 nF</text>
    <path d="M25 46H795" stroke="#c9d1c6" stroke-width="1"/>
  </g>
  <g fill="#e4e9dd" stroke="#789286" stroke-width="1.7">
    <rect x="28" y="88" width="57" height="112" rx="4"/>
    <rect x="735" y="88" width="57" height="112" rx="4"/>
  </g>
  <g fill="none" stroke="#246352" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 103h183m63 0h426M172 103V75m484 28V75"/>
    <rect x="257" y="93" width="63" height="20" fill="#f4f3e9"/>
    <path d="M412 103v38m-17 0h34m-34 10h34m-17 0v35M542 103v24m0 35v24"/>
    <rect x="533" y="127" width="18" height="35" fill="#f4f3e9"/>
    <path d="M74 186h672m-418 0v26"/>
  </g>
  <g fill="#246352">
    <circle cx="172" cy="103" r="4.5"/><circle cx="412" cy="103" r="4.5"/><circle cx="542" cy="103" r="4.5"/><circle cx="656" cy="103" r="4.5"/>
    <circle cx="328" cy="186" r="4.5"/><circle cx="412" cy="186" r="4.5"/><circle cx="542" cy="186" r="4.5"/>
  </g>
  <g fill="#f4f3e9" stroke="#246352" stroke-width="2.8">
    <circle cx="74" cy="103" r="4"/><circle cx="74" cy="186" r="4"/>
    <circle cx="746" cy="103" r="4"/><circle cx="746" cy="186" r="4"/>
    <circle cx="172" cy="69" r="5.5"/><circle cx="656" cy="69" r="5.5"/><circle cx="328" cy="218" r="5.5"/>
  </g>
  <g fill="#213b34" font-family="'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="39" y="76">J1</text><text x="749" y="76">J2</text>
    <text x="39" y="110">1</text><text x="39" y="193">2</text><text x="767" y="110">1</text><text x="767" y="193">2</text>
    <text x="98" y="95" fill="#397663">IN</text><text x="672" y="95" fill="#397663">OUT</text><text x="98" y="213" fill="#397663">GND</text>
    <text x="186" y="76">TP1</text><text x="601" y="76">TP2</text><text x="342" y="225">TP3</text>
    <text x="288" y="81" text-anchor="middle">R1</text><text x="288" y="140" text-anchor="middle">1 kΩ</text>
    <text x="437" y="152" fill="#864921" font-weight="bold">C1</text>
    <text x="561" y="142">R2</text><text x="561" y="165">100 kΩ</text>
  </g>
</svg>
